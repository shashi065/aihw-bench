site_name: AI Hardware Benchmark Suite
site_description: Universal benchmarking and profiling for AI hardware and accelerators.
site_url: https://aihw-bench.github.io/aihw-bench/
repo_url: https://github.com/aihw-bench/aihw-bench
repo_name: aihw-bench/aihw-bench
theme:
  name: material
  features:
    - navigation.sections
    - navigation.instant
    - content.code.copy
    - content.tabs.link
nav:
  - Home: index.md
  - Constitution: constitution.md
  - Beginner Guide: user-guide/beginner.md
  - Engineering:
      - Product Requirements: engineering/prd.md
      - Architecture Specification: engineering/architecture-specification.md
      - Software Requirements: engineering/srs.md
      - Software Design: engineering/sdd.md
      - ADRs: engineering/adrs.md
      - API Specification: engineering/api-specification.md
      - Module Design: engineering/module-design.md
      - Folder Structure: engineering/folder-structure.md
      - Data Model: engineering/data-model.md
      - Configuration System: engineering/configuration-system.md
      - Benchmark Engine: engineering/benchmark-engine.md
      - Storage Design: engineering/storage-design.md
      - Plugin Architecture: engineering/plugin-architecture.md
      - Reporting System: engineering/reporting-system.md
      - Visualization System: engineering/visualization-system.md
      - Security Model: engineering/security-model.md
      - Performance Architecture: engineering/performance-architecture.md
      - CLI Specification: engineering/cli-specification.md
      - Testing Strategy: engineering/testing-strategy.md
      - Release Engineering: engineering/release-engineering.md
      - v1.0 Release Audit: engineering/v1-release-audit.md
      - v1.0.1 Refactoring Report: engineering/v1.0.1-refactoring-report.md
      - v1.0.1 Technical Debt Report: engineering/v1.0.1-technical-debt-report.md
      - v1.0.1 Performance Report: engineering/v1.0.1-performance-report.md
      - v1.1 Performance Report: engineering/v1.1-performance-report.md
      - v1.0.1 Security Report: engineering/v1.0.1-security-report.md
      - Release Plan: engineering/release-plan.md
      - Distribution Strategy: engineering/distribution-strategy.md
      - Version Roadmap: engineering/version-roadmap.md
      - Technical Implementation Roadmap: engineering/technical-implementation-roadmap.md
      - Engineering Handbook: engineering/engineering-handbook.md
      - Coding Standards: engineering/coding-standards.md
      - Contribution Standards: engineering/contribution-standards.md
  - User Guide:
      - Installation: user-guide/installation.md
      - Quick Start: user-guide/quick-start.md
      - Dashboard: user-guide/dashboard.md
      - AI Assistant: user-guide/assistant.md
      - Migration Guide: user-guide/migration.md
      - Tutorials:
          - First Benchmark: tutorials/first-benchmark.md
          - Compare Sessions: tutorials/compare-sessions.md
          - Generate Reports: tutorials/generate-reports.md
          - Build A Plugin: tutorials/build-a-plugin.md
      - CLI: user-guide/cli.md
      - Advanced Guide: user-guide/advanced.md
      - Troubleshooting: user-guide/troubleshooting.md
      - FAQ: user-guide/faq.md
  - Enterprise: enterprise.md
  - Developer Guide:
      - Architecture: developer-guide/architecture.md
      - Contributing: developer-guide/contributing.md
      - Plugin Development: developer-guide/plugin-development.md
      - Model Support: developer-guide/model-support.md
      - Backend Support: developer-guide/backend-support.md
      - Advanced Hardware Support: developer-guide/hardware-support.md
      - Metrics: developer-guide/metrics.md
      - Reporting: developer-guide/reporting.md
      - Visualization: developer-guide/visualization.md
      - Performance Guide: developer-guide/performance.md
  - Benchmarks:
      - Official Suite: benchmarks/official-suite.md
  - Examples:
      - Overview: examples/index.md
      - Configuration Files: examples/configuration.md
      - Python API: examples/python-api.md
      - Plugins: examples/plugins.md
      - Reports: examples/reports.md
  - API Reference:
      - Public Package: api/index.md
      - Application Services: api/application.md
      - Domain Models: api/domain.md
      - Infrastructure: api/infrastructure.md
      - CLI: api/cli.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
plugins:
  - search
  - mkdocstrings
