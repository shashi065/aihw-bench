name: Feature request
description: Propose a capability, backend, metric, report, or workflow.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the expected behavior, API, CLI, plugin, or documentation change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Benchmark engine
        - Profiling engine
        - Metrics engine
        - Comparison engine
        - Hardware abstraction
        - Runtime backend
        - Plugin system
        - Reporting
        - Visualization
        - CLI
        - Documentation
        - CI/CD
        - Packaging
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration impact
      description: Note public API, CLI, plugin API, config, or report format impact.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I reviewed the project constitution and roadmap.
          required: true
        - label: I searched existing issues for similar requests.
          required: true
